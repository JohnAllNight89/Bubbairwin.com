services:
  - type: web
    name: bubbairwintattoo
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    domains:
      - bubbairwintattoo.com
      - www.bubbairwintattoo.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
